name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (Streamlit apps sleep after 48+ hours of inactivity)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run this manually from GitHub

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v5
        with:
          python-version: '3.11'

      - name: Install Selenium and WebDriver
        run: |
          pip install selenium webdriver-manager

      - name: Run wake script
        run: |
          python -c "
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager
          
          options = webdriver.ChromeOptions()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          
          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)
          
          # REPLACE WITH YOUR ACTUAL STREAMLIT URL
          url = 'https://bayesian-ab-testing-yprjf8jfxdczvqrdzxul7n.streamlit.app/'
          
          print(f'Visiting {url}...')
          driver.get(url)
          
          # Wait 15 seconds for the app to spin up or load completely
          time.sleep(15)
          
          print('App successfully pinged!')
          driver.quit()
          "
